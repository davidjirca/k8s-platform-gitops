# raw-manifests/artifactory/secret-gen-job.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: artifactory-secret-builder
  namespace: artifactory
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: artifactory-secret-builder-role
  namespace: artifactory
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: artifactory-secret-builder-binding
  namespace: artifactory
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
subjects:
  - kind: ServiceAccount
    name: artifactory-secret-builder
    namespace: artifactory
roleRef:
  kind: Role
  name: artifactory-secret-builder-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: artifactory-secret-generator
  namespace: artifactory
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      serviceAccountName: artifactory-secret-builder
      restartPolicy: OnFailure
      containers:
        - name: secret-generator
          image: bitnami/kubectl:latest
          command:
            - /bin/sh
            - -c
            - |
              # Generate keys
              MASTER_KEY=$(tr -dc 'a-f0-9' < /dev/urandom | head -c 64)
              JOIN_KEY=$(tr -dc 'a-f0-9' < /dev/urandom | head -c 64)

              # Create or replace secret
              kubectl create secret generic artifactory-master-key \
                --namespace artifactory \
                --from-literal=master-key="${MASTER_KEY}" \
                --from-literal=join-key="${JOIN_KEY}" \
                --dry-run=client -o yaml | kubectl apply -f -

              echo "Secret 'artifactory-master-key' verified/updated successfully!"
