apiVersion: v1
kind: Service
metadata:
  name: canary-demo-stable
  namespace: default
spec:
  ports:
    - name: http
      port: 80
      targetPort: 80
  selector:
    app: canary-demo
---
apiVersion: v1
kind: Service
metadata:
  name: canary-demo-canary
  namespace: default
spec:
  ports:
    - name: http
      port: 80
      targetPort: 80
  selector:
    app: canary-demo
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: canary-demo
  namespace: default
  labels:
    app: canary-demo
spec:
  replicas: 4
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: canary-demo
  strategy:
    canary:
      stableService: canary-demo-stable
      canaryService: canary-demo-canary
      steps:
        # Step 1: Route 20% traffic to Canary and wait 20s
        - setWeight: 20
        - pause: { duration: 20s }
        # Step 2: Run Prometheus HTTP Success Rate analysis
        - analysis:
            templates:
              - templateName: http-success-rate
                clusterScope: true
        # Step 3: Route 50% traffic to Canary and wait 30s
        - setWeight: 50
        - pause: { duration: 30s }
        # Step 4: Run Prometheus P99 Latency analysis
        - analysis:
            templates:
              - templateName: http-latency-p99
                clusterScope: true
        # Step 5: Full 100% promotion to Stable
        - setWeight: 100
  template:
    metadata:
      labels:
        app: canary-demo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: app
          image: traefik/whoami:v1.10.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
