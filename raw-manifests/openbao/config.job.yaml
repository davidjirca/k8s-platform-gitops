apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-init-config
  namespace: openbao
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: openbao-cli
          image: hashicorp/vault:1.15.2
          env:
            - name: VAULT_ADDR
              value: "http://openbao-vault.openbao.svc.cluster.local:8200"
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openbao-token
                  key: token
                  optional: true
          command:
            - /bin/sh
            - -c
            - |
              # Fallback to root token if secret is not present
              export VAULT_TOKEN=${VAULT_TOKEN:-root}

              echo "Waiting for OpenBao to respond..."
              until vault status; do sleep 2; done

              echo "Enabling KV v2 secret engine at 'secret'..."
              vault secrets enable -path=secret kv-v2 || true

              echo "Enabling Transit secret engine for dynamic encryption/signing..."
              vault secrets enable -path=transit transit || true

              echo "Creating Transit key for platform encryption..."
              vault write -f transit/keys/platform-key || true

              echo "Enabling Kubernetes auth method..."
              vault auth enable kubernetes || true

              echo "Configuring Kubernetes auth endpoint..."
              vault write auth/kubernetes/config \
                kubernetes_host="https://kubernetes.default.svc:443"

              echo "Writing External Secrets policy with dynamic and KV access..."
              vault policy write external-secrets-policy - <<EOF
              path "secret/data/*" {
                capabilities = ["read"]
              }
              path "secret/metadata/*" {
                capabilities = ["read", "list"]
              }
              path "transit/encrypt/*" {
                capabilities = ["update"]
              }
              path "transit/decrypt/*" {
                capabilities = ["update"]
              }
              path "database/creds/*" {
                capabilities = ["read"]
              }
              path "sys/leases/renew" {
                capabilities = ["update"]
              }
              path "sys/leases/revoke" {
                capabilities = ["update"]
              }
              EOF

              echo "Creating External Secrets role with 1h TTL for dynamic rotation..."
              vault write auth/kubernetes/role/external-secrets-role \
                bound_service_account_names="external-secrets" \
                bound_service_account_namespaces="external-secrets" \
                policies="external-secrets-policy" \
                ttl="1h" \
                max_ttl="24h"

              echo "Writing sample rotated credentials..."
              vault kv put secret/database \
                password="super-secret-db-pass-v1" \
                username="app_user" || true
              vault kv put secret/api \
                token="dynamic-api-token-v1" || true

              echo "OpenBao configuration complete!"
