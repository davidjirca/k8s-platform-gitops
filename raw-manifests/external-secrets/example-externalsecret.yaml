apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: example-app-secret
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  # Automated rotation check interval
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: example-app-secret
    creationPolicy: Owner
  data:
    - secretKey: database-password
      remoteRef:
        key: secret/data/database
        property: password
    - secretKey: api-token
      remoteRef:
        key: secret/data/api
        property: token
