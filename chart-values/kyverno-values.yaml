crds:
  install: true

admissionController:
  replicas: 1
  resources:
    limits:
      memory: 384Mi
    requests:
      cpu: 100m
      memory: 128Mi

backgroundController:
  replicas: 1

reportsController:
  replicas: 1

# Completely disable report cleanup CronJobs (Kyverno 3.2.x schema)
cleanupJobs:
  admissionReports:
    enabled: false
  clusterAdmissionReports:
    enabled: false
  ephemeralReports:
    enabled: false
  clusterEphemeralReports:
    enabled: false

reportsCleanup:
  enabled: false

cleanupController:
  enabled: false

features:
  logging:
    format: text
  cleanupServer:
    enabled: false
