# Disable Helm upgradeCRDs hook job (ArgoCD handles CRDs natively)
upgradeCRDs: false
cleanUpCRDs: false

image:
  repository: velero/velero
  tag: v1.14.1

initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.10.1
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins

configuration:
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: velero-backups
      default: true
      config:
        region: us-east-1
        s3Url: http://seaweedfs-s3.seaweedfs.svc:8333
        s3ForcePathStyle: "true"
        insecureSkipTLSVerify: "true"
  volumeSnapshotLocation:
    - name: default
      provider: aws
      config:
        region: us-east-1

credentials:
  useSecret: true
  name: velero-s3-credentials
  secretContents:
    cloud: |
      [default]
      aws_access_key_id = any
      aws_secret_access_key = any

# Enable node-agent (Kopia / Restic) for volume backups
deployNodeAgent: true

nodeAgent:
  podVolumePath: /var/lib/kubelet/pods
  privileged: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi
