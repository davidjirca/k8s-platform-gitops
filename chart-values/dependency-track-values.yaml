frontend:
  replicaCount: 1
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi

apiserver:
  replicaCount: 1
  resources:
    limits:
      memory: 1.5Gi
    requests:
      cpu: 250m
      memory: 768Mi
  initContainers:
    resources:
      limits:
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 128Mi

postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: library/postgres
    tag: 15-alpine

persistence:
  enabled: true
  existingClaim: "" # Leave blank so Helm generates and binds it
  storageClass: "local-path"
  accessMode: ReadWriteOnce
  size: 10Gi
