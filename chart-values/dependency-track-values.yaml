# chart-values/dependency-track-values.yaml

# Enable the Frontend Web UI
frontend:
  enabled: true
  replicaCount: 1
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Enable the API Server
apiserver:
  enabled: true
  replicaCount: 1
  persistentVolume:
    enabled: true
    storageClass: "local-path"
    size: 10Gi
    existingClaim: ""

# Configure Ingress to point to the Frontend
ingress:
  enabled: true
  className: traefik
  annotations:
    kubernetes.io/ingress.class: traefik
  hosts:
    - host: dtrack.codeforge.local
      paths:
        - path: /
          pathType: Prefix
          # Point to frontend service
          serviceName: dependency-track-frontend
          servicePort: 8080
